name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend — Pest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.4 to match the dunglas/frankenphp:1-php8.4 image. composer.json
          # allows ^8.3, but CI should exercise the version that ships.
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction

      # Only so APP_KEY exists — .env is gitignored, and a missing key would
      # fail the suite the moment anything resolves the encrypter. The database
      # connection does NOT come from here: tests/bootstrap.php pins it to
      # sqlite :memory: via putenv/$_SERVER before Dotenv loads, and Dotenv does
      # not overwrite existing values, so .env.example's DB_CONNECTION=mysql
      # never reaches the suite.
      - run: cp .env.example .env
      - run: php artisan key:generate

      - run: php artisan test

  proxy:
    name: proxy — go vet + race
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-manager
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-manager/go.mod
          # The module has no external dependencies and no go.sum; the built-in
          # cache keys on go.sum and would only warn.
          cache: false

      - run: go vet ./...

      - run: go test -race ./...

  frontend:
    name: frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # /products is force-dynamic, so nothing fetches at build time and no API
      # URL env vars are required here.
      - run: npm run build
